stages:
  - lint
  - type-check
  - test
  - deploy

variables:
  PYTHONPATH: "."

default:
  image: python:3.11-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -e .

lint-job:
  stage: lint
  script:
    - ruff check src/ tests/ scripts/
    - ruff format --check src/ tests/ scripts/

typecheck-job:
  stage: type-check
  script:
    - mypy src/

pytest-job:
  stage: test
  script:
    - pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

observability-pages-gate:
  stage: test
  script:
    - python scripts/run_eval.py --output-html test_artifacts/index.html
    - test -s test_artifacts/index.html
    - echo "✅ Observability dashboard compilation verified across branches."
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH != "main"

pages:
  stage: deploy
  script:
    - python -c "import os; print('CI DATABASE_URL set:', bool(os.getenv('DATABASE_URL')))"
    - python scripts/run_eval.py --output-html public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy-cloud-run:
  stage: deploy
  image: google/cloud-sdk:alpine
  before_script:
    - echo "Authenticating with Google Cloud SDK..."
    - if [ -n "$GCP_SERVICE_KEY" ]; then echo "$GCP_SERVICE_KEY" | base64 -d > /tmp/gcp_key.json && gcloud auth activate-service-account --key-file=/tmp/gcp_key.json; fi
    - if [ -n "$GCP_PROJECT_ID" ]; then gcloud config set project "$GCP_PROJECT_ID"; fi
  script:
    - PROJECT="${GCP_PROJECT_ID:-$(gcloud config get-value project)}"
    - REGION="${GCP_REGION:-asia-northeast1}"
    - SERVICE_NAME="pickforme-api"
    - echo "Deploying PickForMe to Cloud Run ($SERVICE_NAME in $REGION)..."
    - gcloud builds submit --tag "gcr.io/${PROJECT}/${SERVICE_NAME}:latest"
    - gcloud run deploy "${SERVICE_NAME}"
        --image "gcr.io/${PROJECT}/${SERVICE_NAME}:latest"
        --platform managed
        --region "${REGION}"
        --allow-unauthenticated
        --memory 1Gi
        --cpu 1
        --min-instances 0
        --max-instances 5
        --port 8080
        --set-env-vars "DATABASE_URL=${DATABASE_URL},TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN},TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET},GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY},GEMINI_API_KEY=${GEMINI_API_KEY},GROQ_API_KEY=${GROQ_API_KEY},LLM_PRIMARY_PROVIDER=${LLM_PRIMARY_PROVIDER:-groq},TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}"
    - SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" --platform managed --region "${REGION}" --format 'value(status.url)')
    - echo "✅ Deployed successfully to Cloud Run! Public URL: $SERVICE_URL"
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

