stages:
  - lint
  - type-check
  - test
  - deploy

variables:
  PYTHONPATH: "."

default:
  image: python:3.11-slim
  before_script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install -e .

lint-job:
  stage: lint
  script:
    - ruff check src/ tests/ scripts/
    - ruff format --check src/ tests/ scripts/

typecheck-job:
  stage: type-check
  script:
    - mypy src/

pytest-job:
  stage: test
  script:
    - pytest tests/ -v --cov=src --cov-report=term-missing --cov-report=xml:coverage.xml --junitxml=report.xml
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

pages:
  stage: deploy
  script:
    - python scripts/run_eval.py --output-html public/index.html
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
