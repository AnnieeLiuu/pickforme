steps:
  # 1. 建構 Docker 容器映像檔
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/pickforme-api:$COMMIT_SHA', '.']

  # 2. 推送映像檔至 Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/pickforme-api:$COMMIT_SHA']

  # 3. 自動更新部署至 Cloud Run (自動套用現有環境變數與 no-cpu-throttling)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'pickforme-api'
      - '--image'
      - 'gcr.io/$PROJECT_ID/pickforme-api:$COMMIT_SHA'
      - '--region'
      - 'asia-northeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--no-cpu-throttling'
      - '--timeout'
      - '300s'

images:
  - 'gcr.io/$PROJECT_ID/pickforme-api:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
